# Nginx конфиг для malaus.online
# Скопируй в: /etc/nginx/sites-available/anonymous-messenger
# Затем: ln -sf /etc/nginx/sites-available/anonymous-messenger /etc/nginx/sites-enabled/anonymous-messenger
# И: nginx -t && systemctl reload nginx
#
# ВАЖНО: УДАЛИ/ОТКЛЮЧИ все другие конфиги, где есть server_name malaus.online
# иначе будут конфликты и "rewrite cycle".

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name malaus.online www.malaus.online;

  # Всегда редиректим на HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name malaus.online www.malaus.online;

  # Let's Encrypt (пути могут отличаться если certbot создавал -0001)
  ssl_certificate     /etc/letsencrypt/live/malaus.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/malaus.online/privkey.pem;

  # Безопасные настройки TLS
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_session_tickets off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # --------------------
  # Статика (Vite build)
  # --------------------
  root /var/www/anonymous-messenger/client/dist;
  index index.html;

  # Важно: index.html не кэшируем, чтобы обновления приходили сразу
  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Ассеты Vite можно кэшировать долго (они с хешем в имени)
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    expires 30d;
    try_files $uri =404;
  }

  # SPA роутинг без циклов
  location / {
    try_files $uri $uri/ /index.html;
  }

  # --------------------
  # Backend health (optional)
  # --------------------
  location /health {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
  }

  # --------------------
  # Socket.IO (WebSocket)
  # --------------------
  location /socket.io/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  # --------------------
  # Голосовые (HTTP /audio/:id)
  # --------------------
  location /audio/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
}
