<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anonymous Messenger</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="layout">
      <!-- ============================
           Sidebar (Chats)
           ============================ -->
      <aside class="sidebar">
        <div class="sbTop">
          <div class="brand">
            <div class="brandTitle">Anonymous Messenger</div>
            <div class="brandSub">Голосовые как в Telegram</div>
          </div>
        </div>

        <div class="sbCard">
          <div class="label">Ваш ник</div>
          <div class="row">
            <button id="profileAvatarBtn" class="profileAvatar" title="Сменить аватар" aria-label="Сменить аватар">
              <img id="profileAvatarImg" alt="avatar" />
            </button>
            <input id="nickInput" placeholder="например: Аноним42" />
            <button id="saveNickBtn" class="btnSmall">Сохранить</button>
            <button id="randomNickBtn" class="btnSmall">Случайный</button>
          </div>
          <div class="small" id="nickStatus"></div>
        </div>

        <div class="sbCard">
          <div class="label">Комнаты</div>
          <div class="row">
            <input id="roomId" placeholder="Room ID (вставь код или создай)" />
            <button id="joinBtn" class="btnPrimary">Войти</button>
            <button id="createBtn">Новый</button>
          </div>
          <div class="small" id="invite"></div>
        </div>

        <div class="sbTools">
          <input id="chatSearch" class="sbSearch" placeholder="Поиск чатов…" />
          <select id="chatSort" class="sbSelect">
            <option value="recent">Сортировка: по активности</option>
            <option value="created">Сортировка: по дате создания</option>
            <option value="name">Сортировка: по имени</option>
          </select>
        </div>

        <div class="sbSectionTitle">Мои чаты</div>
        <div id="chatList" class="chatList"></div>

        <div class="sbSectionTitle">Присоединённые</div>
        <div id="joinedList" class="chatList"></div>
      </aside>

      <!-- ============================
           Main (Chat)
           ============================ -->
      <main class="main">
        <header class="topbar">
          <div class="active">
            <div id="activeChatTitle" class="activeTitle">Выберите чат</div>
            <div id="activeChatMeta" class="activeMeta"></div>
          </div>

          <div class="topActions">
            <button id="copyInviteBtn" class="btnSmall">🔗 Скопировать</button>
            <button id="soundBtn" class="btnSmall">🔊 Звук</button>
            <button id="notifyBtn" class="btnSmall">🔔 Уведомления</button>
          </div>
        </header>

        <div class="statusRow">
          <div id="typingLine" class="small"></div>
          <div id="onlineList" class="small" style="text-align:right;"></div>
        </div>

        <div id="chat" class="chat"></div>

        <div class="composer">
          <input id="msgInput" placeholder="Напиши сообщение…" />
          <button id="sendBtn" class="btnPrimary">Отправить</button>
          <button id="recBtn">🎤</button>
          <button id="stopBtn" disabled>⏹</button>
        </div>

        <div class="small" id="recStatus"></div>

        <!-- Панель записи голосового (как в Telegram) -->
        <div id="voicePanel" class="voicePanel" style="display:none;">
          <span id="voiceTimer">00:00</span>
          <span id="voiceHint" class="small">⬅️ влево — отмена • ⬆️ вверх — замок</span>
          <button id="voiceCancelBtn" class="btnSmall" style="display:none;">❌ Отменить</button>
          <button id="voiceSendBtn" class="btnSmall btnPrimary" style="display:none;">✅ Отправить</button>
        </div>
      </main>
    </div>

    <!-- Avatar picker -->
    <div id="avatarModal" class="modal" style="display:none;">
      <div class="modalCard">
        <div class="modalTitle">Выберите аватар</div>
        <div id="avatarGrid" class="avatarGrid"></div>
        <div class="row" style="justify-content:flex-end; margin-top: 10px;">
          <button id="avatarCloseBtn" class="btnSmall">Закрыть</button>
        </div>
      </div>
    </div>

    <!-- First-run registration (anonymous) -->
    <div id="regModal" class="modal" style="display:none;">
      <div class="modalCard" style="max-width:520px;">
        <div class="modalTitle">Создать анонимный профиль</div>
        <div class="small" style="opacity:.9; margin-bottom:10px;">
          Телефон и почта не нужны. Выберите аватар и ник — и можно начинать.
        </div>

        <div class="row" style="gap:10px;">
          <button id="regAvatarBtn" class="profileAvatar" title="Выбрать аватар" aria-label="Выбрать аватар">
            <img id="regAvatarImg" alt="avatar" />
          </button>
          <input id="regNickInput" placeholder="например: Аноним42" style="flex:1;" />
        </div>

        <div class="small" id="regError" style="margin-top:8px; color:#ff9090;"></div>

        <div class="row" style="justify-content:flex-end; gap:8px; margin-top:12px;">
          <button id="regRandomBtn" class="btnSmall">Случайный ник</button>
          <button id="regContinueBtn" class="btnPrimary">Продолжить</button>
        </div>
      </div>
    </div>

    <script src="./main.js" type="module"></script>
  </body>
</html>
